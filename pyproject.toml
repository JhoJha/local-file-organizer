[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-file-organizer"
version = "0.1.0"
description = "Inventario local y read-only de archivos personales (V1)."
requires-python = ">=3.9"
dependencies = [
    # Needed only for V2.1 perceptual image hashing: the standard library
    # has no JPEG/PNG decoder, and Pillow is the small, well-maintained
    # library that fills that one gap (grayscale + resize) without pulling
    # in a heavier CV/ML stack.
    "pillow>=9.1,<13",
    # Needed for V2.3 local face detection (YuNet, via OpenCV's
    # FaceDetectorYN); -headless variant because this is a CLI tool with
    # no GUI/display need (smaller install, no X11/Qt bindings).
    "opencv-python-headless>=4.8,<5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.9.10",
]

[tool.setuptools.packages.find]
where = ["src"]
